<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おふとんガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@700;800&family=M+PLUS+Rounded+1c:wght@500;800&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1C1A40; --indigo:#2B2A63; --hair:#6A6CA0; --cream:#FFF0C9; --futon:#FF8FB3; --gold:#F7C948;
  --ink:#FFF7EA; --sub:#C9C4F0; --panel:rgba(255,255,255,.06);
  --bg-top:#2B2A63; --bg-bot:#141232;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --hand:"Yusei Magic","Klee One","Hiragino Maru Gothic ProN",cursive;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg-top:#3A3880; --bg-bot:#1E1C4A; }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg-top:#2B2A63; --bg-bot:#141232; }
}
:root[data-theme="dark"]{ --bg-top:#2B2A63; --bg-bot:#141232; }
:root[data-theme="light"]{ --bg-top:#3A3880; --bg-bot:#1E1C4A; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:var(--body);color:var(--ink);
  background:radial-gradient(120% 60% at 50% 0%, var(--bg-top), var(--bg-bot) 70%) fixed, var(--bg-bot);
  -webkit-font-smoothing:antialiased; overflow-x:hidden}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{max-width:560px;margin:0 auto;padding:12px 14px 40px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 0;background:linear-gradient(var(--bg-top) 70%, transparent)}
.logo{font-family:var(--display);font-size:20px;line-height:1;letter-spacing:.02em;color:var(--cream);
  text-shadow:0 2px 0 #E2638F, 0 0 14px rgba(255,143,179,.5)}
.yenn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;
  background:rgba(0,0,0,.3);border:1.5px solid rgba(247,201,72,.6);font-weight:800;font-variant-numeric:tabular-nums}
.yenn .coin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:13px;
  background:radial-gradient(circle at 35% 30%,#fff6c8,#F7C948 45%,#B8770F);color:#6b3d00}
.yenn small{font-size:11px;color:var(--gold);font-weight:800}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);font-size:16px}
.tabs{display:flex;gap:6px;margin:4px 0 14px}
.tabs button{flex:1;padding:10px 0;border-radius:14px;border:0;background:var(--panel);font-weight:800;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--cream);color:var(--indigo);box-shadow:0 3px 0 #D9B86A}
.tabs button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- banner ---------- */
.banner{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/4.3;
  background:
    radial-gradient(circle at 78% 18%, rgba(255,240,201,.9) 0 5%, rgba(255,240,201,.18) 5.5% 12%, transparent 22%),
    linear-gradient(180deg,#232056 0%,#3B3586 55%,#5A4C9E 100%);
  box-shadow:0 0 0 3px rgba(247,201,72,.75), 0 0 0 7px rgba(43,42,99,1), 0 0 0 9px rgba(247,201,72,.35), 0 18px 40px rgba(0,0,0,.45)}
.banner .stars{position:absolute;inset:0;background-image:
  radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle,#fff 1.2px,transparent 1.8px);
  background-size:73px 61px,131px 97px;background-position:10px 20px,40px 5px;opacity:.55;animation:twinkle 3s ease-in-out infinite alternate}
.banner .window{position:absolute;left:34%;top:7%;width:24%;aspect-ratio:1/1.2;border-radius:12px 12px 4px 4px;
  border:5px solid #8A7CC8;background:linear-gradient(#141232,#2B2A63);box-shadow:inset 0 0 0 3px #4C438F}
.banner .window::before,.banner .window::after{content:"";position:absolute;background:#8A7CC8}
.banner .window::before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.banner .window::after{top:50%;left:0;right:0;height:4px}
.banner .b-gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner .futon{position:absolute;left:-6%;right:-6%;bottom:-8%;height:30%;border-radius:50% 50% 0 0/38% 38% 0 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.35) 46px 49px),
    radial-gradient(circle,rgba(255,255,255,.45) 3px,transparent 3.5px) 0 0/22px 22px,
    linear-gradient(#FFB3CB,#FF8FB3 60%,#E86C96)}
.banner .futon::before{content:"";position:absolute;left:12%;top:-22%;width:30%;height:42%;border-radius:40%;
  background:linear-gradient(#FFFDF6,#F1E6CF);box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.banner .b-chara{position:absolute;right:-4%;bottom:-22%;width:56%;filter:drop-shadow(0 0 18px rgba(255,240,201,.45));
  animation:bob 3.2s ease-in-out infinite}
.banner .title{position:absolute;left:6%;top:7%;writing-mode:vertical-rl;font-family:var(--display);font-size:clamp(34px,10vw,54px);
  line-height:1.05;color:var(--cream);-webkit-text-stroke:2px #2B2A63;paint-order:stroke fill;
  text-shadow:4px 4px 0 #E2638F, 0 0 24px rgba(255,143,179,.7)}
.banner .pick{position:absolute;left:4%;right:40%;bottom:6%;font-size:12.5px;line-height:1.55;font-weight:800;color:#3A2550;
  background:rgba(255,247,234,.92);border-radius:14px;padding:8px 11px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.banner .pick b{color:#D4447A}
.pulls{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:18px}
.pull{position:relative;border:0;border-radius:20px;padding:14px 8px 12px;font-family:var(--display);font-size:19px;line-height:1.2;
  transition:transform .08s}
.pull:active{transform:translateY(3px)}
.pull small{display:block;font-family:var(--body);font-weight:800;font-size:12.5px;margin-top:4px}
.pull.one{background:linear-gradient(#FFFDF6,#E9DDF9);color:var(--indigo);box-shadow:0 5px 0 #9D8FD0}
.pull.tenbtn{background:linear-gradient(#FFF3B0,#F7C948 55%,#E3A82A);color:#5A3200;box-shadow:0 5px 0 #A86E10, 0 0 24px rgba(247,201,72,.45);overflow:hidden}
.pull.tenbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  background-size:250% 100%;animation:sheen 2.6s ease-in-out infinite}
.pull.tenbtn .tag{position:absolute;top:-1px;right:10px;font-family:var(--body);font-size:10.5px;font-weight:800;background:#D4447A;color:#fff;padding:2px 7px;border-radius:0 0 8px 8px}
.pull:disabled{filter:grayscale(.7);opacity:.6}
.minor{display:flex;justify-content:center;gap:18px;margin-top:16px}
.link{background:none;border:0;color:var(--sub);font-size:13px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:6px}

/* ---------- book ---------- */
.book-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.comp{font-weight:800;font-size:14px;color:var(--sub);margin-right:auto}
.comp b{font-family:var(--display);font-size:22px;color:var(--cream);font-weight:400}
.chip{border:1.5px solid rgba(255,255,255,.2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--indigo);border-color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
.slot{position:relative;border:0;background:none;padding:0}
.slot .cnt{position:absolute;right:-4px;bottom:-6px;z-index:5;font-size:11px;font-weight:800;background:var(--cream);color:var(--indigo);border-radius:999px;padding:1px 7px}
.empty{aspect-ratio:63/88;border-radius:10px;display:grid;place-items:center;background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 8px,transparent 8px 16px),rgba(0,0,0,.25);
  border:2px dashed rgba(255,255,255,.18);color:rgba(255,255,255,.35);font-family:var(--display);font-size:26px}
.empty small{display:block;font-family:var(--body);font-size:10px;font-weight:800;text-align:center;margin-top:-30px}
.sec-title{font-family:var(--display);font-size:15px;margin:18px 0 10px;color:var(--cream);display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(255,240,201,.5),transparent)}

/* =====================================================
   CARD
   ===================================================== */
.card{container-type:inline-size;position:relative;aspect-ratio:63/88;--px:50%;--py:50%;--rx:0deg;--ry:0deg;--ga:0;perspective:1400px;
  font-family:var(--body);user-select:none;-webkit-user-select:none}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .6s cubic-bezier(.2,.9,.25,1.25)}
.card.live .flip{transition:transform .08s linear}
.flip.down{transform:rotateY(180deg)}
.face,.backface{position:absolute;inset:0;border-radius:4.5cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 2cqw 5cqw rgba(0,0,0,.45)}
.backface{transform:rotateY(180deg)}
.face>*{position:absolute}
.bg{inset:0;z-index:1}
.chara{z-index:2;left:3.5cqw;right:3.5cqw;top:3.5cqw;bottom:29cqw;overflow:hidden;border-radius:2.5cqw 2.5cqw 0 0}
.chara img{position:absolute;max-width:none;width:100cqw;left:50%;top:4cqw;transform:translateX(-50%)}
.frame{z-index:3;inset:0;padding:3.5cqw;border-radius:4.5cqw;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.inline{z-index:3;inset:3.5cqw;border-radius:2.5cqw;pointer-events:none}
.plate{z-index:5;left:3.5cqw;right:3.5cqw;bottom:3.5cqw;height:26cqw;display:flex;flex-direction:column;justify-content:center;
  padding:0 4cqw;border-radius:0 0 2.5cqw 2.5cqw;gap:.6cqw}
.plate .no{font-size:3.2cqw;font-weight:800;opacity:.75;letter-spacing:.05em}
.plate .nm{font-family:var(--hand);font-size:8.6cqw;line-height:1.05;white-space:nowrap}
.plate .qt{font-size:3.5cqw;font-weight:800;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{z-index:6;top:5.5cqw;left:5.5cqw;font-family:var(--display);line-height:1}
.glare{z-index:8;inset:0;pointer-events:none;opacity:var(--ga);transition:opacity .25s;
  background:radial-gradient(circle at var(--px) var(--py),rgba(255,255,255,.65),rgba(255,255,255,0) 42%);mix-blend-mode:soft-light}

/* --- R --- */
.r-R .bg{background:
  radial-gradient(circle,rgba(255,255,255,.6) 1.1cqw,transparent 1.3cqw) 0 0/8cqw 8cqw,
  radial-gradient(circle at 50% 30%,rgba(255,255,255,.7),transparent 65%), var(--bg)}
.r-R .frame{background:linear-gradient(160deg,#FFFBF1,#F6E9CF)}
.r-R .inline{border:.6cqw solid var(--hair);opacity:.55}
.r-R .plate{background:linear-gradient(#FFF7E6,#F6E9CF);color:#34306A;border-top:.6cqw dashed rgba(106,108,160,.45)}
.r-R .badge{width:10cqw;height:10cqw;border-radius:50%;display:grid;place-items:center;font-size:5.2cqw;
  background:var(--hair);color:#fff;box-shadow:0 0 0 .8cqw #FFF7E6}

/* --- SR --- */
.r-SR .bg{background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3cqw,transparent 3cqw 6cqw),
  radial-gradient(circle at 50% 30%,rgba(255,255,255,.75),transparent 60%),
  linear-gradient(165deg,var(--c1),var(--c2))}
.r-SR .frame{background:linear-gradient(135deg,#F7F9FD,#AEB5C8 22%,#FFFFFF 40%,#7F879D 58%,#E8ECF5 78%,#9198AE);
  box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.6)}
.r-SR .inline{border:.5cqw solid rgba(255,255,255,.9);box-shadow:0 0 0 .5cqw rgba(60,66,90,.35)}
.r-SR .plate{background:linear-gradient(rgba(43,42,99,.94),rgba(22,20,52,.97));color:#fff;border-top:.7cqw solid #DDE2EE}
.r-SR .plate .nm{background:linear-gradient(#FFFFFF,#C9D0E2 55%,#FFFFFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.r-SR .badge{padding:1.6cqw 3cqw;border-radius:99px;font-size:5cqw;color:#2B2A63;
  background:linear-gradient(135deg,#fff,#AEB5C8 40%,#fff 60%,#8C93A8);box-shadow:0 0 0 .6cqw rgba(255,255,255,.8),0 1cqw 2cqw rgba(0,0,0,.3)}
.paw{z-index:6;width:6cqw;height:6cqw;opacity:.9}
.paw.a{right:5cqw;top:5cqw}.paw.b{left:5cqw;bottom:31.5cqw;transform:rotate(-20deg)}.paw.c{right:5cqw;bottom:31.5cqw;transform:rotate(20deg)}

/* --- SSR --- */
.r-SSR .bg{background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--c1) 55%,#fff) 0,var(--c1) 22%,var(--c2) 78%)}
.rays{z-index:1;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,240,200,.28) 0 7deg,transparent 7deg 20deg);
  animation:spin 26s linear infinite}
.sky{z-index:1;inset:0;background-image:radial-gradient(circle,#fff .5cqw,transparent .8cqw),radial-gradient(circle,#FFF0C9 .7cqw,transparent 1cqw);
  background-size:17cqw 13cqw,29cqw 23cqw;background-position:3cqw 4cqw,11cqw 9cqw;opacity:.7;animation:twinkle 2.4s ease-in-out infinite alternate}
.motif{z-index:1;left:50%;top:34%;width:84cqw;transform:translate(-50%,-50%);color:#FFE28A;opacity:.38}
.motif svg{display:block;width:100%;height:auto}
.r-SSR .chara.pop{z-index:4;top:0;left:3.5cqw;right:3.5cqw;border-radius:0;
  -webkit-mask:linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0)}
.r-SSR .chara.pop img{width:110cqw;top:-1cqw;filter:drop-shadow(0 0 2.4cqw rgba(255,226,138,.75))}
.r-SSR .frame{background:
  linear-gradient(110deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) 0 0/260% 100%,
  linear-gradient(135deg,#FFF3B0,#D99A1E 20%,#FFF6C8 40%,#B8770F 56%,#FFE27A 74%,#A8660A);
  animation:sheen 3.2s ease-in-out infinite}
.r-SSR .inline{border:.6cqw solid #FFF3B0;box-shadow:0 0 2cqw rgba(255,214,90,.8),inset 0 0 2cqw rgba(255,214,90,.5)}
.r-SSR .plate{background:linear-gradient(rgba(28,26,64,.94),rgba(14,12,36,.98));color:#FFE9B0;border-top:.8cqw solid #F7C948;
  box-shadow:0 -1.5cqw 4cqw rgba(247,201,72,.35)}
.r-SSR .plate .nm{font-size:9.2cqw;background:linear-gradient(#FFF8D8,#F7C948 50%,#C98612 70%,#FFE9A0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .4cqw 0 rgba(0,0,0,.5))}
.r-SSR .badge{padding:1.8cqw 3.4cqw;border-radius:99px;font-size:5.6cqw;color:#5A3200;letter-spacing:.04em;
  background:linear-gradient(135deg,#FFF6C8,#F7C948 40%,#FFF3B0 55%,#C98612);
  box-shadow:0 0 0 .7cqw #FFF3B0,0 0 4cqw rgba(247,201,72,.9)}
.corner{z-index:6;width:9cqw;height:9cqw;color:#FFF3B0;filter:drop-shadow(0 0 1.5cqw rgba(247,201,72,.9))}
.corner.tr{right:1cqw;top:1cqw}.corner.bl{left:1cqw;bottom:1cqw}.corner.br{right:1cqw;bottom:1cqw}
.corner svg{width:100%;height:100%;display:block}

/* --- HOLO --- */
.holo-l{z-index:7;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background-image:repeating-linear-gradient(115deg,#ff6f8f 0%,#ffd86b 6%,#9bff8a 12%,#6ff3ff 18%,#7d8bff 24%,#e07dff 30%,#ff6f8f 36%);
  background-size:420% 420%;background-position:var(--px) var(--py);filter:brightness(.62) contrast(1.6) saturate(1.4)}
.card.auto .holo-l,.card.auto .holo-g{animation:holoDrift 5s ease-in-out infinite alternate}
.holo-g{z-index:7;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.9}
.r-SR .holo-g{background-image:
  radial-gradient(circle,#fff .35cqw,transparent .55cqw),radial-gradient(circle,#fff .3cqw,transparent .5cqw),radial-gradient(circle,#FFE6F0 .45cqw,transparent .7cqw);
  background-size:5cqw 5cqw,7.3cqw 7.3cqw,11cqw 11cqw;background-position:calc(var(--px) * .2) calc(var(--py) * .2),2cqw 3cqw,calc(var(--px) * -.3) 5cqw}
.r-SSR .holo-g{z-index:3;mix-blend-mode:color-dodge;opacity:.7;
  background-image:repeating-linear-gradient(60deg,#ff6f8f 0%,#ffd86b 8%,#6ff3ff 16%,#e07dff 24%,#ff6f8f 32%);
  background-size:300% 300%;background-position:calc(100% - var(--px)) var(--py);filter:brightness(.8) contrast(1.4);
  -webkit-mask:var(--textmask) 0 0/34cqw 22cqw;mask:var(--textmask) 0 0/34cqw 22cqw}
.r-R .holo-l{opacity:.5}
.holo-mark{z-index:9;top:5.5cqw;right:5cqw;font-size:3.6cqw;font-weight:800;color:#fff;padding:1cqw 2.6cqw;border-radius:99px;
  background:linear-gradient(90deg,#ff6f8f,#ffb84d,#5fdc8f,#4fb7ff,#b77dff);box-shadow:0 0 0 .5cqw rgba(255,255,255,.85),0 0 3cqw rgba(255,255,255,.7);
  text-shadow:0 .2cqw .4cqw rgba(0,0,0,.35)}
.r-SR.holo .paw.a{display:none}
.card.holo::before{content:"";position:absolute;inset:-1.5cqw;border-radius:6cqw;z-index:-1;opacity:.75;filter:blur(2.2cqw);
  background:conic-gradient(from var(--hue,0deg),#ff6f8f,#ffd86b,#9bff8a,#6ff3ff,#7d8bff,#e07dff,#ff6f8f);animation:hue 4s linear infinite}

/* --- back --- */
.backface{background:
  linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%) 0 0/14cqw 14cqw,
  linear-gradient(-45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%) 0 0/14cqw 14cqw,
  radial-gradient(circle at 50% 42%,#4A4596,#2B2A63 60%,#1C1A40);
  box-shadow:inset 0 0 0 3cqw #FFF0C9,inset 0 0 0 4cqw #F7C948,0 2cqw 5cqw rgba(0,0,0,.45)}
.bk{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4cqw}
.bk-moon{width:30cqw;height:30cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFFBEA,#FFE7A6);
  box-shadow:0 0 6cqw rgba(255,231,166,.7);-webkit-mask:radial-gradient(circle at 72% 30%,transparent 42%,#000 43%);mask:radial-gradient(circle at 72% 30%,transparent 42%,#000 43%)}
.bk-logo{font-family:var(--display);font-size:8cqw;line-height:1.1;text-align:center;color:#FFF0C9;text-shadow:0 .8cqw 0 #E2638F}
.card.aura-SR .backface{box-shadow:inset 0 0 0 3cqw #E8ECF5,inset 0 0 0 4cqw #9AA2B8,0 0 8cqw rgba(220,228,255,.9)}
.card.aura-SSR .backface{box-shadow:inset 0 0 0 3cqw #FFF3B0,inset 0 0 0 4cqw #F7C948,0 0 10cqw rgba(255,214,90,1);animation:shake .5s ease-in-out infinite}
.card.aura-SSR .backface::after{content:"";position:absolute;inset:0;background:conic-gradient(from var(--hue,0deg),#ff6f8f55,#ffd86b55,#6ff3ff55,#e07dff55,#ff6f8f55);
  animation:hue 2s linear infinite;mix-blend-mode:screen}
.card.holo-hint .backface{outline:1.2cqw solid transparent;box-shadow:inset 0 0 0 3cqw #fff,inset 0 0 0 4cqw #ff9ad0,0 0 9cqw #9bf6ff}
.new{position:absolute;z-index:12;left:50%;top:-3.5cqw;transform:translateX(-50%);font-family:var(--display);font-size:clamp(9px,6cqw,16px);
  color:#fff;background:#D4447A;padding:.4em .8em;border-radius:99px;box-shadow:0 0 0 2px #fff;white-space:nowrap}

/* =====================================================
   STAGE (3D)
   ===================================================== */
.stage{position:fixed;inset:0;z-index:100;background:#0E0C26;overflow:hidden;touch-action:manipulation}
.stage[hidden]{display:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene{position:absolute;inset:0;z-index:2}
#fxl{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.skip{position:absolute;z-index:50;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:9px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.45);font-weight:800;font-size:13px}
.hint{position:absolute;z-index:50;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.6);
  animation:blink 1.2s ease-in-out infinite;pointer-events:none}
.flash{position:absolute;inset:0;z-index:40;background:#fff;pointer-events:none;animation:flash .45s ease-out forwards}
.whiteout{position:absolute;inset:0;z-index:35;background:#fff;opacity:0;animation:wo .45s ease-in forwards;pointer-events:none}
@keyframes wo{to{opacity:1}}

/* results */
.results{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 14px 24px}
.results.hide{visibility:hidden}
.single{width:min(68vw,300px);position:relative}
.single .card{animation:flyIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2vw,12px);width:min(100%,540px);position:relative}
.ten .card{animation:flyIn .4s cubic-bezier(.2,.9,.3,1.2) both}
.res-actions[hidden]{display:none!important}
.res-actions{display:flex;gap:10px;position:relative;z-index:2}
.res-actions button{border:0;border-radius:16px;padding:12px 18px;font-weight:800;font-size:14px}
.btn-cream{background:var(--cream);color:var(--indigo);box-shadow:0 4px 0 #C9A85E}
.btn-gold{background:linear-gradient(#FFF3B0,#F7C948 60%,#E3A82A);color:#5A3200;box-shadow:0 4px 0 #A86E10}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.3)!important}
.res-name{position:relative;font-family:var(--hand);font-size:22px;text-align:center;min-height:1.4em;text-shadow:0 2px 8px #000}
.flip.spin{animation:flipSpin .95s cubic-bezier(.12,.8,.2,1)}
@keyframes flipSpin{0%{transform:rotateY(-1080deg) scale(1.4) translateZ(80px)}70%{transform:rotateY(-20deg) scale(1.08)}100%{transform:rotateY(0) scale(1)}}

/* =====================================================
   TEXT FX (After Effects風)
   ===================================================== */
.tfx{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-family:var(--display);font-size:var(--fs);line-height:1.08;
  white-space:nowrap;text-align:center;pointer-events:none;font-variant-numeric:tabular-nums}
.tfx.vert{writing-mode:vertical-rl}
.tfx-in{position:relative;transform:rotate(var(--rot));
  animation:tPunch .42s calc(var(--n) * var(--step) + var(--d) + 380ms) cubic-bezier(.3,1.9,.5,1) both}
.tfx .L{position:absolute;inset:0}
.tfx .L.glow{position:relative}
.tfx .c{display:inline-block;animation:cIn .55s calc(var(--i) * var(--step) + var(--d)) cubic-bezier(.2,1.5,.35,1) both}
.tfx .glow{color:var(--gc);filter:blur(.2em);animation:gPulse 1.1s calc(var(--n) * var(--step) + var(--d) + 400ms) ease-in-out infinite alternate}
.tfx .ext{color:var(--ec);-webkit-text-stroke:.22em var(--ec);transform:translateY(.13em);
  text-shadow:0 .04em 0 var(--ec),0 .08em 0 var(--ec),0 .3em .4em rgba(0,0,0,.6)}
.tfx .st{color:var(--sc);-webkit-text-stroke:.22em var(--sc)}
.tfx .st2{color:transparent;-webkit-text-stroke:.09em var(--s2,#fff)}
.tfx .fill .c{color:transparent;
  background-image:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%),linear-gradient(180deg,var(--f1) 0%,var(--f2) 40%,var(--f3) 60%,var(--f4) 100%);
  background-size:320% 100%,100% 100%;background-position:160% 0,0 0;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;
  animation:cIn .55s calc(var(--i) * var(--step) + var(--d)) cubic-bezier(.2,1.5,.35,1) both,
            sweep 2s calc(var(--i) * 45ms + var(--n) * var(--step) + var(--d) + 320ms) ease-in-out infinite}
.t-rainbow .fill .c{background-image:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%),
  linear-gradient(180deg,#fff 0%,hsl(calc(var(--i) * 50deg) 100% 76%) 38%,hsl(calc(var(--i) * 50deg + 35deg) 100% 56%) 100%)}
.tfx .rgb{mix-blend-mode:screen;opacity:0;animation:rgbSplit .55s calc(var(--n) * var(--step) + var(--d) + 300ms) ease-out both}
.tfx .rgb.r{color:#ff2a6d;--dx:-.1em}.tfx .rgb.b{color:#2af5ff;--dx:.1em}
.tfx .flare{position:absolute;left:50%;top:52%;width:190%;height:.14em;border-radius:50%;transform:translate(-50%,-50%) scaleX(0);
  background:radial-gradient(closest-side,#fff,rgba(255,236,190,.7) 45%,transparent);mix-blend-mode:screen;
  animation:flare .75s calc(var(--n) * var(--step) + var(--d) + 360ms) ease-out both}
.tfx .flare::before{content:"";position:absolute;left:50%;top:50%;width:2.2em;height:2.2em;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,214,140,.35) 25%,transparent 62%)}
.tfx.vert .flare{display:none}
.tfx.out .tfx-in{animation:tOut .35s ease-in forwards}

.t-gold{--f1:#FFFFFF;--f2:#FFF3B0;--f3:#F7B733;--f4:#FFE9A8;--sc:#B8336A;--ec:#3E1030;--gc:#FFC83D}
.t-pink{--f1:#FFFFFF;--f2:#FFD9E7;--f3:#FF5F98;--f4:#FFC7DB;--sc:#2B2A63;--ec:#120F33;--gc:#FF8FB3}
.t-silver{--f1:#FFFFFF;--f2:#FFFFFF;--f3:#BFC8DE;--f4:#FFFFFF;--sc:#2B2A63;--ec:#0E0C26;--gc:#8FB8FF}
.t-rainbow{--sc:#2B2A63;--ec:#0E0C26;--gc:#FFFFFF}
.t-hand{font-family:var(--hand);--f1:#FFFDF2;--f2:#FFF0C9;--f3:#FFE09A;--f4:#FFF6DA;--sc:#2B2A63;--ec:#0E0C26;--gc:#FFF0C9}
.t-hand .st,.t-hand .ext{-webkit-text-stroke-width:.16em}
.t-digital{--f1:#FFFFFF;--f2:#FFFFFF;--f3:#FFC2CF;--f4:#FFFFFF;--sc:#40000F;--ec:#000;--gc:#FF2D55;--s2:#FF6B86}
.t-glitch .rgb{animation:glitch .16s steps(2) infinite}
.t-glitch .tfx-in{animation:jitter .2s steps(2) infinite}

@keyframes cIn{0%{opacity:0;transform:translateY(-55%) rotateX(85deg) scale(2.5);filter:blur(12px)}55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes gPulse{from{opacity:.6}to{opacity:1}}
@keyframes sweep{0%{background-position:160% 0,0 0}45%,100%{background-position:-60% 0,0 0}}
@keyframes rgbSplit{0%{opacity:.95;transform:translateX(var(--dx))}100%{opacity:0;transform:none}}
@keyframes glitch{0%{opacity:.85;transform:translate(var(--dx),.03em)}50%{opacity:.55;transform:translate(calc(var(--dx) * -1.4),-.04em)}100%{opacity:.85;transform:translate(var(--dx),0)}}
@keyframes jitter{0%{transform:rotate(var(--rot)) translate(0,0) skewX(0)}50%{transform:rotate(var(--rot)) translate(.02em,-.01em) skewX(-4deg)}100%{transform:rotate(var(--rot))}}
@keyframes flare{0%{opacity:0;transform:translate(-50%,-50%) scaleX(0)}30%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}100%{opacity:0;transform:translate(-50%,-50%) scaleX(1.35)}}
@keyframes tPunch{0%{transform:rotate(var(--rot)) scale(1)}35%{transform:rotate(var(--rot)) scale(1.15)}100%{transform:rotate(var(--rot)) scale(1)}}
@keyframes tOut{to{opacity:0;transform:rotate(var(--rot)) scale(1.5);filter:blur(10px)}}
/* ---- luxury additions ---- */
.flash.warm{background:#FFF3D6}

.t-lux,.t-luxsub{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;letter-spacing:.08em}
.t-lux{--f1:#FFFCEB;--f2:#F6DE9A;--f3:#B8862B;--f4:#FFF0BE;--sc:#2A1A05;--ec:#000;--gc:#FFD98A}
.t-luxsub{--f1:#FFF8E6;--f2:#FFF0CC;--f3:#E9D2A0;--f4:#FFF8E6;--sc:#1A1206;--ec:#000;--gc:#FFE6B0;letter-spacing:.3em}
.t-lux .fill .c{background-image:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%),
  linear-gradient(180deg,#FFFCEB 0%,#F6DE9A 30%,#B8862B 50%,#FFF0BE 64%,#C99A3E 100%)}

.t-lux .fill .c,.t-luxsub .fill .c{animation:cLux 1s calc(var(--i) * var(--step) + var(--d)) cubic-bezier(.2,.8,.2,1) both, sweep 2.6s calc(var(--i) * 50ms + var(--n) * var(--step) + var(--d) + 500ms) ease-in-out infinite}
.t-lux .tfx-in,.t-luxsub .tfx-in{animation:tPunchLux .8s calc(var(--n) * var(--step) + var(--d) + 500ms) ease-out both}

.tfx .orn{position:absolute;left:50%;bottom:-.32em;width:130%;height:.5em;transform:translateX(-50%) scaleX(0);
  background:linear-gradient(90deg,transparent,#F6DE9A 30%,#F6DE9A 70%,transparent) center/100% 1px no-repeat;
  animation:orn .9s calc(var(--n) * var(--step) + var(--d) + 300ms) cubic-bezier(.2,.8,.2,1) both}
.tfx .orn::after{content:"";position:absolute;left:50%;top:50%;width:.22em;height:.22em;background:#FFE7A6;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 .3em #FFD27A}
@keyframes cLux{0%{opacity:0;transform:translateY(.3em) scale(1.35);filter:blur(10px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes tPunchLux{0%{transform:scale(1)}30%{transform:scale(1.05)}100%{transform:scale(1)}}

.cflash.gold{background:radial-gradient(circle,#fff6d0,#ffb800)}
.cflash.rainbow{background:conic-gradient(#ff5c8a,#ffb84d,#fff03d,#5fdc8f,#4fb7ff,#b77dff,#ff5c8a)}
.cdown{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);text-align:center;font-family:"Dela Gothic One",sans-serif;color:#fff;
  padding:10px 22px 14px;border-radius:18px;background:rgba(5,4,20,.75);border:2px solid #F2CF73;box-shadow:0 0 30px rgba(247,201,72,.5)}
.cdown small{display:block;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:14px;letter-spacing:.3em;color:#F6DE9A}
.cdown b{font-weight:400;font-size:clamp(40px,12vw,68px);font-variant-numeric:tabular-nums;text-shadow:0 0 18px #ff3355}
.cdown.hot{animation:cdShake .1s linear infinite;border-color:#ff5a78}
.cdown.win{border-color:#fff;box-shadow:0 0 80px #FFD27A}
.cdown.win b{color:#FFE9A8;text-shadow:0 0 30px #FFC24A}
.cdown.lose{opacity:.55;filter:grayscale(1)}
@keyframes cdShake{50%{transform:translate(calc(-50% + 3px),calc(-50% - 2px))}}
.mvskip{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:auto;z-index:5;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font-weight:800;font-size:12.5px;transition:opacity .3s}
.mvfinal{position:absolute;inset:0;animation:fadeIn .15s both;opacity:0}
.mvfinal.out{animation:none;opacity:0;transition:opacity .25s}
.mvchar{position:absolute;right:-8%;bottom:-6%;height:96%;filter:drop-shadow(0 0 24px #fff) drop-shadow(0 0 4px #ff6fa3);animation:charIn .45s cubic-bezier(.2,1.4,.4,1) both, bob 2s ease-in-out .5s infinite}
@keyframes charIn{from{transform:translateX(40%) scale(1.3);opacity:0}to{transform:none;opacity:1}}
.ribbon{position:absolute;left:-10%;right:-10%;bottom:9%;height:clamp(40px,9vw,64px);background:linear-gradient(#ff2d55,#c40f3a);transform:rotate(-7deg);border-top:4px solid #fff;border-bottom:4px solid #fff;
  overflow:hidden;display:flex;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.ribbon span{white-space:nowrap;font-family:"Shippori Mincho B1",serif;font-weight:800;color:#fff;font-size:clamp(18px,4.8vw,30px);animation:marq 4s linear infinite;padding-left:10%}
@keyframes marq{to{transform:translateX(-50%)}}
.rushb{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 16px;border-radius:999px;
  background:linear-gradient(90deg,#ff5c8a,#b77dff,#4fb7ff);color:#fff;font-weight:800;box-shadow:0 0 24px rgba(255,92,138,.7);border:2px solid #fff;white-space:nowrap;animation:hueS 3s linear infinite}
.rushb span{font-family:"Shippori Mincho B1",serif;font-size:15px}
.rushb b{font-size:15px;font-variant-numeric:tabular-nums}
.rushb em{font-style:normal;font-family:"Dela Gothic One",sans-serif;font-size:16px;background:#fff;color:#c4245a;border-radius:999px;padding:1px 10px}

/* data */
.btn-danger{border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:13px;background:#E0304F;color:#fff}
.danger-box{margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(224,48,79,.12);border:1.5px solid rgba(224,48,79,.6)}
.danger-box p{margin:0 0 10px;color:#FFD6DC}
/* modal */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(8,6,24,.82);backdrop-filter:blur(6px)}
.modal[hidden]{display:none}
.viewer{width:min(78vw,340px);display:flex;flex-direction:column;align-items:center;gap:14px}
.viewer .card{width:100%;touch-action:none}
.viewer .info{text-align:center}
.viewer .info .q{font-family:var(--hand);font-size:20px}
.viewer .info .m{font-size:12.5px;color:var(--sub);font-weight:800;margin-top:4px}
.viewer .row{display:flex;gap:8px}
.sheet{background:#25225A;border:2px solid rgba(255,240,201,.3);border-radius:22px;padding:20px 22px;width:min(92vw,400px);line-height:1.7}
.sheet h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;color:var(--cream)}
.sheet table{width:100%;border-collapse:collapse;font-size:14px}
.sheet td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.sheet td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sheet p{font-size:13px;color:var(--sub);margin:10px 0 14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:200;background:var(--cream);color:var(--indigo);
  font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toast 2.2s ease forwards}

/* keyframes */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{from{opacity:.35}to{opacity:.85}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes sheen{0%{background-position:120% 0,0 0}60%,100%{background-position:-120% 0,0 0}}
@keyframes holoDrift{0%{background-position:0% 20%}100%{background-position:100% 80%}}
@property --hue{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes hue{to{--hue:360deg}}
@keyframes shake{0%,100%{transform:rotateY(180deg) rotate(0)}25%{transform:rotateY(180deg) rotate(1.5deg)}75%{transform:rotateY(180deg) rotate(-1.5deg)}}
@keyframes shakeBig{0%,100%{transform:none}20%{transform:translate(-10px,6px)}40%{transform:translate(9px,-7px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(6px,5px)}}
@keyframes flash{from{opacity:.95}to{opacity:0}}
@keyframes pulse{from{opacity:.65;transform:scale(1)}to{opacity:1;transform:scale(1.04)}}
@keyframes pop{0%{opacity:0;transform:translate(var(--tx,-50%),-50%) scale(2.6) rotate(-8deg)}100%{opacity:1;transform:translate(var(--tx,-50%),-50%) scale(1) rotate(-8deg)}}
@keyframes pop2{0%{opacity:0;transform:scale(2.6) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes sparkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.4) rotate(90deg);opacity:1}}
@keyframes whiteout{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(2)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes bandIn{to{transform:skewY(-8deg) translateX(0)}}
@keyframes slideIn{to{transform:translateX(0)}}
@keyframes blink{50%{opacity:.25}}
@keyframes flyIn{from{transform:translateY(60px) scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes speed{to{background-position:0 61px}}
@keyframes mspin{from{transform:rotate(-1080deg)}to{transform:rotate(0deg)}}
@keyframes hspin{from{transform:rotate(-60deg)}to{transform:rotate(150deg)}}
@keyframes run{0%{transform:translateX(-160%)}45%{transform:translateX(-50%)}70%{transform:translateX(-50%)}100%{transform:translateX(130%)}}
@keyframes pageOff{to{transform:rotateX(-100deg) translateY(-30px);opacity:0}}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes futonUp{to{bottom:-8%}}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(30px,-60px) rotate(12deg)}}
@keyframes homeGlow{to{transform:translate(-50%,-50%) scale(5);opacity:.95}}
@keyframes rise{from{transform:translate(-50%,40%)}to{transform:translate(-50%,0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .banner .b-chara,.rays,.sky,.r-SSR .frame,.pull.tenbtn::after,.card.holo::before{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">おふとん<br>ガチャ</div>
    <div class="yenn" aria-label="所持yenn"><span class="coin">¥</span><span id="yenn">0</span><small>yenn</small></div>
    <button class="icon-btn" id="mute" aria-label="音のオンオフ">🔊</button>
    <button class="icon-btn" id="settings" aria-label="データ設定">⚙</button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="gacha">ガチャ</button>
    <button role="tab" aria-selected="false" data-tab="book">図鑑</button>
    <button role="tab" aria-selected="false" data-tab="slot">スロット</button>
  </nav>

  <main>
    <section id="v-gacha">
      <div class="banner">
        <div class="stars"></div>
        <div class="window"></div>
        <img class="b-chara" id="banner-chara" alt=""><canvas class="b-gl" id="banner-gl"></canvas>
        <div class="futon"></div>
        <div class="title">おふとん<br>ガチャ</div>
        <div class="pick">SSRは<b>10種すべて個別演出</b>つき。全カードに<b>ホロ版</b>あり</div>
      </div>
      <div class="pulls">
        <button class="pull one" id="pull1">1回ひく<small>300 yenn</small></button>
        <button class="pull tenbtn" id="pull10"><span class="tag">SR以上1枚確定</span>10連ひく<small>3,000 yenn</small></button>
      </div>
      <div class="minor">
        <button class="link" id="rates-btn">提供割合</button>
      </div>
    </section>

    <section id="v-slot" hidden>
      <div class="slot-card">
        <h2>おふとんスロット</h2>
        <p>中段に3つ揃えてyennを増やそう。キャラの顔が揃えば確変突入!<br>ためたyennでガチャが引けます。</p>
        <div class="slot-icons" id="slot-icons"></div>
        <button class="slot-go" id="slot-go">スロットで遊ぶ</button>
      </div>
    </section>
    <section id="v-book" hidden>
      <div class="book-head">
        <div class="comp">コンプ <b id="comp">0</b> / <span id="comp-all">60</span></div>
        <button class="chip" id="t-holo" aria-pressed="false">ホロ版</button>
        <button class="chip" id="t-sample" aria-pressed="false">見本モード</button>
      </div>
      <div id="book"></div>
    </section>
  </main>
</div>

<div class="stage" id="stage" hidden>
  <canvas id="gl"></canvas>
  <div class="scene" id="scene"></div>
  <div id="fxl"></div>
  <button class="skip" id="skip">スキップ</button>
  <div class="hint" id="hint">タップで早送り</div>
</div>

<div class="modal" id="modal" hidden></div>

const CHARA_VS=`
uniform float uTime,uAmp,uSquash,uSeed,uW,uH; uniform vec2 uLook; varying vec2 vUv;
void main(){
  vUv=uv; vec3 p=position; float y=uv.y, x=uv.x; float t=uTime+uSeed;
  float headW=smoothstep(.47,.62,y);
  float br=sin(t*1.9);
  p.y+=br*.006*uH*smoothstep(0.,.6,y)*(1.-headW*.6);
  p.x*=1.+br*.007*smoothstep(.62,.3,y);
  vec2 piv=vec2(0.,(.55-.5)*uH);
  float ang=(sin(t*.85)*.032+sin(t*1.7)*.01-uLook.x*.07)*uAmp*headW;
  vec2 d=p.xy-piv; p.xy=piv+vec2(d.x*cos(ang)-d.y*sin(ang),d.x*sin(ang)+d.y*cos(ang));
  p.x+=uLook.x*.035*uW*headW*smoothstep(.55,.8,y); p.y+=uLook.y*.02*uH*headW;
  float hairW=smoothstep(.2,.42,abs(x-.5))*smoothstep(.74,.48,y)*smoothstep(.22,.42,y);
  p.x+=hairW*(sin(t*1.5+y*6.)*.022+sin(t*2.3+y*9.)*.008)*uW*uAmp;
  float earW=smoothstep(.85,.97,y)*smoothstep(.12,.32,abs(x-.5));
  p.y+=earW*pow(max(0.,sin(t*.9)),12.)*sin(t*14.)*.012*uH;
  float hemW=smoothstep(.25,.05,y);
  p.x+=hemW*sin(t*1.2+x*4.)*.01*uW*uAmp;
  float by=p.y+uH*.5; p.y=by*(1.-uSquash)-uH*.5; p.x*=1.+uSquash*.55;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
}`;

uniform sampler2D uTex; uniform float uBright,uFlash,uOpacity,uRim; uniform vec3 uRimC; varying vec2 vUv;
void main(){ vec4 c=texture2D(uTex,vUv); if(c.a<.03) discard;

function slotsFor(n){
  const narrow=FX.narrow();
  if(n===1) return {cam:[0,2.05,narrow?10.2:8.2],look:[0,2.05,0],slots:[{p:[0,2.05,0],s:1}]};
  if(narrow){ const rows=[3,4,3], s=.4, sx=1.08, ys=[4.1,2.5,.9]; const out=[]; rows.forEach((cnt,ri)=>{ for(let i=0;i<cnt;i++) out.push({p:[(i-(cnt-1)/2)*sx,ys[ri],0],s}); }); return {cam:[0,2.5,11.2],look:[0,2.5,0],slots:out}; }
  const s=.5, sx=1.5, ys=[3.05,1.1]; const out=[]; for(let r=0;r<2;r++) for(let i=0;i<5;i++) out.push({p:[(i-2)*sx,ys[r],0],s}); return {cam:[0,2.1,8.4],look:[0,2.05,0],slots:out};
}

function waitTear(pk,colorOf){
  return new Promise(res=>{
    let sx=null, prog=0, done=false, autoing=false;
    const setProg=p=>{ pk.tear.scale.x=Math.max(.0001,p); const x=-pk.W/2+p*pk.W; const wp=pk.g.localToWorld(new FX.T.Vector3(x,pk.topY-.04,.08));

function slotBet(){ return SLOT_BASE*SL.mul; }
async function stopFaces(stops,alive){ const M=SL.m; M.reels.forEach(r=>r.mat.color.set(0xFFE2A0)); startReels(26);
  for(let i=0;i<3;i++){ await sleep(i===0?600:480); if(!alive()) return; await stopReel(M.reels[i],stops[i],{slam:true}); SFX.bell(1); } }
async function slotSpin(){
  const sid=SL.sid; if(SL.busy||!SL.m) return; const bet=slotBet();
  if(S.yenn<bet){ SL.auto=false; updSlotUI(); toast('yennが足りません'); return; }
  SL.busy=true; S.yenn-=bet; save(); slotWin(''); clearTexts();
  const wasRush=SL.rush>0; if(wasRush){ SL.rush--; save(); }
  updSlotUI(); rushBadge();
  const tb=SL.turbo?.55:1, alive=()=>sid===SL.sid;
  const p=slotPlan(slotLottery(),SL.mul); const stops=slotStops(p); let M=SL.m;
  tone(520,.05,'triangle',.05);
  if(p.step){ await stepUp(p.step); if(!alive()) return; }
  if(p.sheep) sheepSwarm();
  startReels(SL.turbo||wasRush?30:22);
  if(p.movie==='lever'){
    await sleep(520); if(!alive()) return;
    await kakuhenMovie(alive); if(!alive()) return;
    SL.m=buildSlot(); M=SL.m; await stopFaces(stops,alive); if(!alive()) return;
  } else {
    for(let g=1;g<=p.giji;g++){ await sleep(480); if(!alive()) return; await nextFX(g); if(!alive()) return; }
    for(let i=0;i<2;i++){ await sleepTap((i===0?420:180)*tb); if(!alive()) return; await stopReel(M.reels[i],stops[i]); if(!alive()) return; }
    if(p.reach){
      const hi=p.reach==='face'; setLamps(hi?'gold':'white','blink'); moodFace(hi?'13':'11');
      const lt=LUX(hi?'激アツ リーチ':'リーチ',{y:'9%',fs:'clamp(28px,8.5vw,52px)'}); SFX.whoosh();
      const b0=M.bgm.uniforms.uA.value.clone(); FX.tween(300,k=>M.bgm.uniforms.uA.value.copy(b0).multiplyScalar(1-.6*k));
      M.reels.slice(0,2).forEach(r=>r.mat.color.set(0xffffff)); M.lineMat.opacity=.8;
      const r3=M.reels[2];
      const hb=setInterval(()=>{ if(!alive()){clearInterval(hb);return} tone(70,.18,'sine',.12); FX.glow(.15); },420);
      FX.tween(800,k=>r3.speed=(SL.turbo?30:22)*(1-k)+6*k,E.out);
      if(p.push){ await sleep(500); if(!alive()) return; await pushButton(p.push,alive); if(!alive()) return; }
      const win=p.res===p.reach;
      if(p.sp){ tfxOut(lt); await countdown(win,alive); } else await sleep((hi?1500:p.reach==='door'?500:1000)*tb);
      clearInterval(hb); if(!alive()) return;
      await stopReel(r3,stops[2],{slam:true}); tfxOut(lt);
      FX.tween(300,k=>M.bgm.uniforms.uA.value.copy(b0).multiplyScalar(.4+.6*k)); M.reels.forEach(r=>r.mat.color.set(0xdedad2)); M.lineMat.opacity=.35;
      if(SL.rush>0||wasRush) applyRushLook();
    } else { await sleepTap(170*tb); if(!alive()) return; await stopReel(M.reels[2],stops[2]); }
    if(!alive()) return;
    if(p.movie==='after'){ await sleep(500); if(!alive()) return; await kakuhenMovie(alive); if(!alive()) return; SL.m=buildSlot(); M=SL.m; await stopFaces(stops,alive); if(!alive()) return; }
  }
  const sym=p.res==='lose'?null:p.res;
  if(sym==='face'){
    if(wasRush){ SL.chain++; await rushHitSeq(alive); if(!alive()) return; }
    else { SL.chain=1; SL.rushGain=0; }
    SL.rush=RUSH_ST; save(); applyRushLook();
  }
  if(sym) await slotPayout(sym,bet,p,alive,wasRush); else { if(p.reach||p.step>=2) moodFace('10'); setTimeout(()=>{ if(alive()&&!SL.busy) moodFace('08'); },900); }
  if(!alive()) return;
  if(SL.rush>0) SL.rushGain+=sym?bet*PAY[sym]:0;
  save();
  if(wasRush&&SL.rush===0&&sym!=='face'){ await rushEnd(alive); if(!alive()) return; }
  if(SL.rush>0) applyRushLook(); else { setLamps('none','chase'); }
  M.reels.forEach(r=>r.mat.color.set(0xdedad2));
  SL.busy=false; save(); updSlotUI(); rushBadge();
  if(SL.auto){ if(S.yenn>=slotBet()) setTimeout(()=>{ if(alive()&&SL.auto) slotSpin(); }, sym?(PAY[sym]>=15?1400:600):220); else { SL.auto=false; updSlotUI(); } }
}
async function rushEnd(alive){ const t1=LUX('確変終了',{y:'14%',fs:'clamp(36px,11vw,64px)'}); const t2=SUB(`${SL.chain}連 / ${SL.rushGain.toLocaleString()} yenn 獲得`,{y:'24%',d:400}); SFX.chime(); applyRushLook();
  await sleep(2400); tfxOut(t1); tfxOut(t2); SL.chain=0; SL.rushGain=0; save(); }
function coinRain(n=140){
  const T=FX.T; const geo=new T.CylinderGeometry(.22,.22,.04,32); const im=new T.InstancedMesh(geo,new T.MeshStandardMaterial({map:FX.coinTex(),metalness:1,roughness:.22,color:0xffe9b0}),n); im.frustumCulled=false; FX.root.add(im);
  const d=[...Array(n)].map(()=>({p:[(Math.random()-.5)*8,5+Math.random()*7,(Math.random()-.5)*2+1.2],v:-(3+Math.random()*3),r:[Math.random()*6,Math.random()*6,0],w:[(Math.random()-.5)*14,(Math.random()-.5)*8,0]}));
  const m4=new T.Matrix4(),q=new T.Quaternion(),e=new T.Euler(),s=new T.Vector3(1,1,1),p=new T.Vector3();
  im.userData.up=FX.on((t,dt)=>{ d.forEach((o,i)=>{ o.v-=7*dt; o.p[1]+=o.v*dt; o.r[0]+=o.w[0]*dt; o.r[1]+=o.w[1]*dt; p.set(...o.p); q.setFromEuler(e.set(o.r[0],o.r[1],0)); m4.compose(p,q,s); im.setMatrixAt(i,m4); }); im.instanceMatrix.needsUpdate=true; });
  setTimeout(()=>FX.remove(im),4200);
}
async function slotPayout(sym,bet,p,alive,wasRush){
  const M=SL.m, win=bet*PAY[sym]; S.yenn+=win; save();
  M.lineMat.opacity=.9; const blink=FX.on(t=>{ const on=(Math.floor(t*10)%2)?1:.55; M.reels.forEach(r=>r.mat.color.setScalar(.87*on+.13)); M.lineMat.opacity=.4+.5*on; });
  setTimeout(()=>{ FX.off(blink); if(alive()){ M.reels.forEach(r=>r.mat.color.set(0xdedad2)); M.lineMat.opacity=.35; } }, sym==='face'?3200:sym==='clock'?1600:700);
  const dur=sym==='face'?2600:sym==='clock'?1300:sym==='door'?700:300; countWin(win,dur);
  if(sym==='pillow'){ tone(880,.08,'triangle',.05); tone(1320,.1,'triangle',.04,.06); updSlotUI(); return; }
  if(sym==='door'){ SFX.sr(); moodFace('14'); M.reels.forEach(r=>FX.burst([r.mesh.position.x,M.WY,.6],{n:50,speed:3,color:'#FFE6A0',size:.35})); const t=SUB('帰宅ドア ×5',{y:'9%'}); setTimeout(()=>tfxOut(t),1100); }
  if(sym==='clock'){ SFX.fanfare(); moodFace('17'); setLamps('gold','blink'); FX.ring([0,M.WY,.5],{color:'#FFE28A',to:7}); const c=FX.confetti({n:140,at:[0,M.WY+.4,1],speed:5}); setTimeout(()=>FX.remove(c),3800); FX.glow(.9);
    const t=LUX('定時!',{y:'9%',fs:'clamp(36px,11vw,64px)'}); setTimeout(()=>tfxOut(t),1800); }
  if(sym==='face'){ SFX.fanfare(); setTimeout(()=>SFX.bell(3),500); moodFace('17'); setLamps('rainbow','rainbow'); coinRain(170); const c=FX.confetti({n:220,y0:6}); setTimeout(()=>FX.remove(c),5000);
    FX.ring([0,M.WY,.5],{color:'#FFE28A',to:10}); FX.burst([0,M.WY,.8],{n:300,speed:7,rainbow:true,size:.5}); FX.glow(1.2); flash(true);
    const t1=LUX(wasRush?`${SL.chain}連!`:'確変突入',{y:'9%',fs:'clamp(38px,11vw,70px)'}); const t2=SUB(wasRush?'確変継続 残り20回':'×100 / 次の20回は確変',{y:'19%',fs:'clamp(16px,4.6vw,24px)',d:400});
    await sleep(wasRush?2200:3000); tfxOut(t1); tfxOut(t2); }
  else await sleep(sym==='clock'?900:300);
  updSlotUI(); setTimeout(()=>{ if(alive()&&!SL.busy) moodFace('08'); },1800);
}

function countWin(win,dur){ const el=$('#s-win'); if(!el) return; const st=performance.now(); el.className='s-win show'+(win>=slotBet()*15?' big':'');
  (function f(){ const k=Math.min(1,(performance.now()-st)/dur); el.textContent='+'+Math.round(win*E.out(k)).toLocaleString()+' yenn'; if(k<1) requestAnimationFrame(f); else updSlotUI(); })(); }
function slotWin(t){ const el=$('#s-win'); if(el){ el.textContent=t; el.className='s-win'; } }

/* ---- UI ---- */
function slotUIHTML(){ return `<div class="slot-ui">
  <div class="slot-top"><button class="s-btn" id="s-close">とじる</button><div class="s-credit"><span class="coin">¥</span><b id="s-yenn">0</b><small>yenn</small></div><button class="s-btn" id="s-pay">配当表</button></div>
  <div class="s-win" id="s-win"></div>
  <div class="slot-bottom">
    <div class="s-bets" role="group" aria-label="ベット">${[1,10,50].map(m=>`<button data-m="${m}"><b>×${m}</b><small>${(SLOT_BASE*m).toLocaleString()} yenn</small></button>`).join('')}</div>
    <div class="s-row"><button class="s-toggle" id="s-auto">オート</button><button class="s-spin" id="s-spin">回す</button><button class="s-toggle" id="s-turbo">高速</button></div>
    <button class="s-rescue" id="s-rescue" hidden></button>
  </div></div>`; }
function updSlotUI(){ if(!$('#s-yenn')) return; $('#s-yenn').textContent=S.yenn.toLocaleString(); setYenn();
  document.querySelectorAll('.s-bets button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===SL.mul));
  $('#s-auto').setAttribute('aria-pressed',SL.auto); $('#s-turbo').setAttribute('aria-pressed',SL.turbo);
  const sp=$('#s-spin'); sp.textContent=SL.busy?'止める':'回す'; sp.classList.toggle('m50',SL.mul===50); sp.classList.toggle('m10',SL.mul===10);
  const rs=$('#s-rescue'); const low=S.yenn<SLOT_BASE&&!SL.busy; rs.hidden=!low;
  if(low){ const left=(S.rescueAt||0)+RESCUE_CD-Date.now(); rs.disabled=left>0; rs.textContent=left>0?`おこづかい まであと${Math.ceil(left/60000)}分`:`おこづかいを受け取る(${RESCUE_AMT.toLocaleString()} yenn)`; }
  if(SL.m&&SL.rush<=0){ const glow={1:'#FFD98A',10:'#E4E9FF',50:'#FFC24A'}[SL.mul]; if(!SL.busy) SL.m.lampColor.set(glow); }
}
async function openSlot(){
  if(!FX){ toast('この端末では3D表示に対応していません'); return; }
  SL.sid++; SL.busy=false; SL.auto=false; SL.tap=null;
  stage.hidden=false; document.body.style.overflow='hidden'; clearTexts(); setStageUI(false,false);
  scene.innerHTML=slotUIHTML();
  await FX.ready; FX.start(); SL.m=buildSlot(); SL.m.face='08'; applyRushLook();
  $('#s-close').onclick=()=>{ SL.sid++; SL.auto=false; SL.busy=false; SL.m=null; closeStage(); };
  $('#s-pay').onclick=slotPaytable;
  document.querySelectorAll('.s-bets button').forEach(b=>b.onclick=()=>{ if(SL.busy) return; SL.mul=+b.dataset.m; save(); tone(660+SL.mul*8,.06,'triangle',.04); updSlotUI(); });
  $('#s-spin').onclick=()=>{ if(SL.busy){ SL.tap&&SL.tap(); return; } slotSpin(); };
  $('#s-auto').onclick=()=>{ SL.auto=!SL.auto; updSlotUI(); if(SL.auto&&!SL.busy) slotSpin(); };
  $('#s-turbo').onclick=()=>{ SL.turbo=!SL.turbo; save(); updSlotUI(); };
  $('#s-rescue').onclick=()=>{ S.yenn+=RESCUE_AMT; S.rescueAt=Date.now(); save(); SFX.sr(); toast(`おこづかい ${RESCUE_AMT.toLocaleString()} yenn を受け取りました`); updSlotUI(); };
  scene.querySelector('.slot-ui').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; if(SL.busy){ SL.tap&&SL.tap(); } });
  updSlotUI();
}
function slotPaytable(){ const m=$('#modal'); m.style.zIndex=150;
  m.innerHTML=`<div class="sheet"><h2>配当表</h2><p style="margin-top:0">中段の1ラインに3つ揃うと、賭け金×倍率のyennがもらえます。キャラの顔が揃うと確変に突入し、次の20回は大当たりの確率が約8倍になります(確変中に再び揃うと20回に戻ります)。</p><table class="paytbl">
    ${['face','clock','door','pillow'].map(s=>`<tr><td><img src="${symIcon(s,40)}" alt=""><img src="${symIcon(s,40)}" alt=""><img src="${symIcon(s,40)}" alt=""></td><td>${SYM_NAME[s]}</td><td>×${PAY[s]}</td></tr>`).join('')}
    <tr><td class="hz">${['alarm','monday','train'].map(s=>`<img src="${symIcon(s,40)}" alt="">`).join('')}</td><td>ハズレ図柄</td><td>なし</td></tr></table>
    <p>ベットは×1(10 yenn)、×10(100 yenn)、×50(500 yenn)。どのベットでも当たる確率は同じで、×50では予告やリーチがよく出ます。リーチ中や回転中に画面をタップすると、次のリールがすぐ止まります。</p>
    <button class="chip" id="pc">とじる</button></div>`;
  m.hidden=false; $('#pc').onclick=()=>m.hidden=true; m.onclick=e=>{if(e.target===m)m.hidden=true}; }

/* ---------- book ---------- */
let showHolo=false, sample=false;
function renderBook(){
  const owned=Object.keys(S.own).length; $('#comp').textContent=owned;
  const box=$('#book'); box.innerHTML='';
  [['SSR','SSR'],['SR','SR'],['R','R']].forEach(([r,label])=>{
    box.insertAdjacentHTML('beforeend',`<div class="sec-title">${label}${showHolo?'(ホロ版)':''}</div>`);
    const g=el('<div class="grid"></div>'); box.appendChild(g);
    BY[r].forEach(c=>{ const k=c.id+(showHolo?'_h':''); const n=S.own[k]||0;
      if(n||sample){ const b=el(`<button class="slot" aria-label="${c.name}">${cardHTML(c,showHolo,{auto:true,back:false})}${n?`<span class="cnt">×${n}</span>`:''}</button>`);
        b.onclick=()=>openViewer(c,showHolo,false); g.appendChild(b); }
      else g.insertAdjacentHTML('beforeend',`<div class="empty">?</div>`);
    });
  });
}
$('#t-holo').onclick=e=>{showHolo=!showHolo;e.currentTarget.setAttribute('aria-pressed',showHolo);renderBook()};
$('#t-sample').onclick=e=>{sample=!sample;e.currentTarget.setAttribute('aria-pressed',sample);renderBook()};

/* ---------- viewer ---------- */
function openViewer(c,holo,fromStage){
  const m=$('#modal'); const nH=S.own[c.id+'_h']||0, n=S.own[c.id]||0;
  const canToggle = sample || (holo? n>0 : nH>0);
  m.innerHTML=`<div class="viewer"><div id="vcard"></div>
    <div class="info"><div class="q">「${c.quote}」</div><div class="m">${c.r} ${c.name}${holo?'(ホロ)':''}  所持 通常×${n} ホロ×${nH}</div></div>
    <div class="row">${canToggle?`<button class="chip" id="v-t">${holo?'通常版を見る':'ホロ版を見る'}</button>`:''}<button class="chip" id="v-c">とじる</button></div></div>`;
  const v=$('#vcard'); v.innerHTML=cardHTML(c,holo,{back:false}); makeTilt(v.firstElementChild);
  m.hidden=false; m.style.zIndex=fromStage?150:90;
  $('#v-c').onclick=()=>m.hidden=true; if($('#v-t')) $('#v-t').onclick=()=>openViewer(c,!holo,fromStage);
  m.onclick=e=>{ if(e.target===m) m.hidden=true; };
}

    <button class="chip" id="rc">とじる</button></div>`;
  m.hidden=false; $('#rc').onclick=()=>m.hidden=true; m.onclick=e=>{if(e.target===m)m.hidden=true}; };

/* ---------- wiring ---------- */
$('#banner-chara').src=IMGS['17'];
$('#pull1').onclick=()=>pull(1); $('#pull10').onclick=()=>pull(10);
$('#mute').onclick=e=>{S.mute=!S.mute;e.currentTarget.textContent=S.mute?'🔇':'🔊';save()};
$('#mute').textContent=S.mute?'🔇':'🔊';
document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs [data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#v-gacha').hidden=b.dataset.tab!=='gacha'; $('#v-book').hidden=b.dataset.tab!=='book'; $('#v-slot').hidden=b.dataset.tab!=='slot'; if(b.dataset.tab==='book') renderBook(); });
setYenn(); renderBook();
$('#slot-go').onclick=openSlot;

/* ---------- data / autosave ---------- */
addEventListener('pagehide',save); document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
function fmtTime(t){ if(!t) return 'まだ保存されていません'; const d=new Date(t); return d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function openData(){
  const m=$('#modal'); m.style.zIndex=90; const owned=Object.keys(S.own).length;
  m.innerHTML=`<div class="sheet"><h2>データ</h2>
    <p style="margin-top:0">${CAN_SAVE?'プレイの記録は、このブラウザに自動で保存されます。ページを閉じても続きから遊べます。':'このブラウザでは保存ができません。プライベートモードなどを解除すると保存できるようになります。'}</p>
    <table><tr><td>所持yenn</td><td>${S.yenn.toLocaleString()}</td></tr><tr><td>図鑑</td><td>${owned} / ${CARDS.length*2}</td></tr><tr><td>確変</td><td>${SL.rush>0?`残り${SL.rush}回(${SL.chain}連中)`:'なし'}</td></tr><tr><td>最終保存</td><td>${fmtTime(S.savedAt)}</td></tr></table>
    <div id="data-act" style="display:flex;gap:8px;justify-content:space-between;margin-top:16px"><button class="chip" id="d-close">とじる</button><button class="btn-danger" id="d-del">データを削除</button></div></div>`;
  m.hidden=false; m.onclick=e=>{ if(e.target===m) m.hidden=true; }; $('#d-close').onclick=()=>m.hidden=true;
  $('#d-del').onclick=()=>{ $('#data-act').outerHTML=`<div class="danger-box"><p>所持yenn、図鑑、確変の状態がすべて初期状態に戻ります。削除したデータは元に戻せません。</p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="chip" id="d-cancel">キャンセル</button><button class="btn-danger" id="d-yes">削除する</button></div></div>`;
    $('#d-cancel').onclick=openData;
    $('#d-yes').onclick=()=>{ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} S=freshState();
      Object.assign(SL,{mul:10,auto:false,turbo:false,rush:0,chain:0,rushGain:0}); save();
      $('#mute').textContent='🔊'; setYenn(); renderBook(); m.hidden=true; toast('データを削除しました'); };
  };
}
$('#settings').onclick=openData;

imgReady.then(()=>{ $('#slot-icons').innerHTML=['face','clock','door','pillow'].map(k=>`<figure><img src="${symIcon(k,40)}" alt="${SYM_NAME[k]}"><figcaption>×${PAY[k]}</figcaption></figure>`).join(''); });
